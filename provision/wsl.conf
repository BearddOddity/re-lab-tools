# RE lab hardening.
#
# Windows drives are NOT auto-mounted. Only the one exchange folder listed in
# /etc/fstab is visible from Linux, so a stray command in here cannot reach the
# rest of the Windows filesystem.
#
# interop stays ENABLED because Win-KeX needs it to open its viewer window on
# the Windows side. That means Linux can still launch Windows executables, so
# this is a guard against accidents, not a malware boundary. To lock it down
# further when you do not need the desktop, set enabled=false below and run
# `wsl --shutdown`; individual GUI apps via WSLg keep working, `kex` does not.

[user]
default=oddity

[automount]
enabled=false
mountFsTab=true

[interop]
enabled=true
appendWindowsPath=false

[network]
generateHosts=true
generateResolvConf=true
