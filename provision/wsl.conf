# RE lab configuration.
#
# Windows drives are NOT auto-mounted. Only the one exchange folder listed in
# /etc/fstab is visible from Linux, so a stray command in here cannot reach the
# rest of the Windows filesystem.
#
# interop stays ENABLED: WSLg needs it to present Linux windows on the Windows
# side, which is what makes the desktop and the individual GUI apps work. That
# also means Linux can still launch Windows executables, so this is a guard
# against accidents, not a malware boundary. Anything of unknown provenance
# belongs in a Hyper-V VM with networking off, not in here.

[boot]
# Run systemd as PID 1 rather than WSL's minimal init. Without it there are no
# services at all - no cron, no NetworkManager, no printing, no user units, no
# container daemon - which is the practical difference between a desktop and a
# working Linux machine.
systemd=true

[user]
default=oddity

[automount]
enabled=false
mountFsTab=true

[interop]
enabled=true
appendWindowsPath=false

[network]
generateHosts=true
generateResolvConf=true
